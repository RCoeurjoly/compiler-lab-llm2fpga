automated_triage:
  lanes:
    direct: FPGA and LM
    compiler: compiler and (FPGA or RTL or hardware)
    component: FPGA and component
  queue_only: true
  manual_review_triggers:
    - Abstract absent or shorter than 200 characters.
    - Positive and negative terms both match.
    - More than one level receives the same score.
    - Only generic accelerator or transformer terms match.
    - Work is non-FPGA but has compiler terms.
    - Title resembles another record but identifiers disagree.
    - Model is a vision transformer, encoder-only transformer, or training system.
  priority_score:
    fpga_term: 4
    llm_or_causal_lm_term: 4
    transformer_or_attention_term: 3
    compiler_or_generator_term: 3
    end_to_end_term: 2
    component_term: 2
    public_code_url: 2
    doi_or_arxiv_identifier: 1
    llm_for_eda_pattern: -5
    unrelated_workload_pattern: -4
    training_only_pattern: -3

deduplication:
  retain_every_source_record: true
  rules_in_order:
    - Exact normalized DOI.
    - Exact base arXiv identifier after removing version suffixes.
    - Exact authoritative work identifier such as OpenAlex, Semantic Scholar, or PubMed.
    - Exact normalized title after Unicode NFKC, lowercasing, line-break dehyphenation, punctuation removal, and whitespace collapse.
    - Fuzzy title similarity at least 95 of 100 with the same first author and publication years differing by at most one.
    - Fuzzy title similarity at least 92 of 100 with at least two matching authors and a matching DOI prefix, arXiv identifier, or distinctive subtitle.
    - Manual adjudication for all remaining fuzzy candidates.
  manifestation_rule: >-
    Preprint, workshop, conference, and journal manifestations share one work_id
    but retain distinct immutable record_id values.
  preferred_manifestation_order:
    - Corrected peer-reviewed version with artifact.
    - Peer-reviewed version.
    - Latest non-withdrawn preprint.
    - Repository manuscript.
  project_family_rule: >-
    Do not merge papers merely because they use the same repository; group
    clear releases or extensions of one system under project_family_id for
    deep review.

route_families:
  - MLIR_CIRCT
  - PARAMETERIZED_RTL
  - HLS
  - DATAFLOW
  - OVERLAY
  - CPU_FPGA_FALLBACK

hard_eligibility_gates:
  source_access: Source and required artifacts are accessible.
  license: Applicable licenses permit evaluation and intended reuse.
  reproducible_minimal_build: A minimal configuration can be built reproducibly.
  model_path: There is a plausible path to complete prefill or decode, not only isolated MatMul.
  no_required_closed_ip: No indispensable proprietary IP remains in the final qualifying flow.
  complete_rtl: Generated RTL is complete enough to lint and simulate independently.
  test_budget: The route can be tested within the predefined compatibility budget.
  deterministic_reference: Numerical behavior can be compared with a deterministic software reference.

decision_matrix:
  score_range: [0, 5]
  weights:
    demonstrator_score_0_5: 25
    foss_score_0_5: 20
    end_to_end_score_0_5: 15
    reuse_score_0_5: 15
    verification_score_0_5: 10
    hardware_score_0_5: 10
    performance_score_0_5: 5
  rule: >-
    Hard-gate failure overrides the weighted total. The fallback must use a
    different route family from the primary route.

fixtures:
  M0-operators:
    configuration: Int8 or fixed-point MatMul; normalization; activation; RoPE; causal softmax; KV read and write.
    purpose: Determine exact operator and numerical support.
  M1-block:
    configuration: One decoder block, d_model 64, 4 heads, d_ff 128, sequence length 16.
    purpose: Test scheduling, residuals, state, memory, and interfaces.
  M2-tiny-lm:
    configuration: Two decoder blocks, d_model 128, 4 heads, d_ff 256, vocabulary 256, maximum sequence 32, greedy decode of four tokens.
    purpose: Minimal end-to-end token-generation test.
  M3-repository-fixture:
    configuration: Existing TinyStories fixture from the compiler laboratory.
    purpose: Preserve continuity with the present PyTorch and MLIR smoke path.
  shared_constraints: Batch size one and static shapes during initial testing.

compatibility_budget_hours:
  triage: 16
  promising_route: 40
  suspension_rule: >-
    Suspend after 16 hours if complete elaboratable RTL cannot be produced and
    no bounded corrective action exists.

failure_codes:
  F_ENV: Unpinned dependency, unavailable compiler version, or broken container.
  F_SOURCE_MISSING: Generated RTL references modules not committed to the repository.
  F_LICENSE: Required code, model, or IP has no usable license.
  F_FRONTEND: Unsupported operation, dynamic shape, custom operator, or graph mutation.
  F_TYPE: Quantized or fixed-point types cannot be represented or legalized.
  F_LOWERING: Operation remains in an unsupported MLIR dialect.
  F_SCHEDULE: No feasible schedule, excessive unrolling, or uncontrolled resource duplication.
  F_CONTROL: Handshake deadlock or incorrect backpressure, reset, or token-loop semantics.
  F_MEMORY: Tensor buffers fail to map to memory or banking and port counts are infeasible.
  F_STATE: KV cache or recurrent decode state is not preserved correctly.
  F_RTL: Unsupported SystemVerilog, width or sign error, latch inference, or missing hierarchy.
  F_VENDOR_IP: Essential DSP, memory, AXI, HLS, or encrypted IP cannot be replaced.
  F_SYNTH_RESOURCE: Resource expansion makes the design infeasible.
  F_TIMING: Route fails timing at the required clock.
  F_NUMERIC: Arithmetic exceeds the frozen numerical tolerance.
  F_INTERFACE: Host, memory, streaming, or weight-loading interface is incomplete.

deliverables:
  D1: protocol.md
  D2: provenance.json and API retrieval log
  D3: records_normalized.csv
  D4: duplicate_groups.csv and version-family decisions
  D5: phase1_mapping.csv and phase1_mapping.parquet
  D6: phase1_exclusions.csv
  D7: project_families.csv
  D8: deep_review.csv and deep_review.md
  D9: artifact_inventory.csv
  D10: compatibility/<route-id>/ for each tested route
  D11: mlir_circt_stage_matrix.csv
  D12: decision_matrix_scored.csv
  D13: corpus_flow.mmd
  D14: route_family_comparison.md
  D15: timeline.mmd
  D16: final_report.md and final_report.pdf

evidence_policy:
  commit_generated_evidence: true
  raw_regenerable_api_cache: survey/build/api-cache
  accepted_claim_sources:
    - Paper page or section.
    - Repository commit and file path.
    - Generated command log.
    - Simulation or synthesis report.
    - Metadata API response.
    - Explicit reviewer decision.
  credentials_forbidden: true

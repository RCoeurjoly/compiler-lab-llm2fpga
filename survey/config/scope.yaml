schema_version: 1

study_question: >-
  Which implementation route has the highest evidence-supported probability
  of producing reproducible, end-to-end causal-language-model inference on an
  FPGA using a substantially open toolchain, and what reusable components,
  incompatibilities, and fallback routes follow from the literature and
  artifact evidence?

snapshot:
  catalogue_path: LLM-inference-on-FPGA-papers/data/catalog.json
  catalogue_auxiliary_paths:
    - LLM-inference-on-FPGA-papers/data/survey.csv
  papers_commit: 95fd9b9a509f275dd3cfdb3360b33dbcca7429f0
  expected_records: 461
  protocol_stated_records: 459
  amendment: >-
    The supplied protocol stated 459 records. The commit-pinned catalogue has
    461 records, so 461 supersedes the stale count without changing the study
    question, eligibility rules, or review treatment. All 461 records remain
    in source lineage and none may be silently removed.

units:
  screening: bibliographic record
  deep_review: work or project family

levels:
  A:
    operational_definition: >-
      End-to-end or nearly end-to-end autoregressive language-model inference
      on FPGA.
    required_evidence: >-
      At least one complete decoder stack or model; token-generation loop,
      prefill, or decode described; FPGA is a material execution platform.
    review_treatment: >-
      Full RQ1-RQ6 extraction; artifact inspection when available.
  B:
    operational_definition: >-
      Transformer or language-model accelerator implementing a complete block
      or a substantial fraction of the operator stack.
    required_evidence: >-
      Attention, feed-forward network, normalization, scheduling, memory
      architecture, or equivalent block-level coverage.
    review_treatment: Full extraction when architecture is transferable.
  C:
    operational_definition: >-
      Compiler, framework, generator, HLS, MLIR, overlay, or graph-lowering
      route capable of producing FPGA hardware.
    required_evidence: >-
      Credible model, graph, program, or kernel to RTL, HLS, netlist, or
      bitstream path.
    review_treatment: Full extraction for distinct executable routes.
  D:
    operational_definition: >-
      Enabling component or adjacent method with direct transfer potential.
    required_evidence: >-
      MatMul, attention, softmax, normalization, RoPE, quantization, KV cache,
      memory scheduling, verification, or an adjacent accelerator technique.
    review_treatment: Mapping only unless selected to resolve a route-specific gap.
  X:
    operational_definition: Outside the study scope.
    required_evidence: Does not satisfy A-D after full title and abstract inspection.
    review_treatment: Exclude with one controlled reason code.

inclusion:
  general:
    - English title and abstract, or a full English paper.
    - Sufficient bibliographic identity to establish a distinct work.
    - Publicly inspectable abstract, paper, preprint, or technical report.
    - Material relevance to FPGA inference, FPGA hardware generation, or a component necessary for transformer inference.
    - Research paper, project report, dissertation chapter, or primary artifact documentation.
  technical_any:
    - FPGA implementation of an LLM, causal LM, transformer, BERT-like model, decoder, encoder, or attention system.
    - Hardware generation from PyTorch, ONNX, TensorFlow, MLIR, an internal graph IR, C or C++, a DSL, or a parameterized architecture.
    - FPGA implementation of attention, MatMul or GEMM, feed-forward layers, softmax, LayerNorm, RMSNorm, RoPE, quantization, sparsity, KV-cache management, or token-generation control.
    - Overlay, dataflow engine, systolic array, vector engine, or programmable accelerator shown to support transformer-relevant workloads.
    - Verification or synthesis infrastructure directly applicable to the proposed open-source route.
  note: >-
    Secondary surveys may be retained as search aids but are not evidence rows
    for implementation claims. Training and vision-transformer papers are not
    automatically excluded when they contribute a transferable technique.

controlled_exclusions:
  X_NOT_FPGA: No FPGA, reconfigurable-hardware, RTL-generation, or directly transferable hardware-compilation contribution.
  X_LLM_FOR_EDA: Uses an LLM for HDL, RTL, place-and-route, or EDA automation but does not implement LLM inference on FPGA.
  X_TRAINING_ONLY: Training-only architecture without a transferable inference contribution.
  X_NON_LM_MODEL: Unrelated workload without a transformer-relevant compiler or operator contribution.
  X_VIT_NO_TRANSFER: Vision-transformer work without reusable attention, dataflow, compiler, quantization, or memory techniques.
  X_ASIC_GPU_ONLY: Non-FPGA work without a reusable compiler IR, generator, scheduling method, or FPGA-relevant architecture.
  X_PERFORMANCE_MODEL_ONLY: Analytical model or simulation without an implementable architecture or compiler route.
  X_SECONDARY: Survey, editorial, slide deck, or non-primary summary retained only for searching.
  X_NO_EVIDENCE: Metadata is insufficient and no full text or authoritative abstract can be recovered.
  X_DUPLICATE: Duplicate bibliographic manifestation merged into another work.
  X_RETRACTED: Retracted or withdrawn work retained only in provenance records.

